name: Napi árfolyamfrissítés

on:
  schedule:
    - cron: "40 5 * * *"   # 05:40 UTC = 07:40 (nyári idő) / 06:40 (téli idő) Budapesten
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frissítés és mentés (ütközésnél újrapróbálja)
        env:
          SIGNAL_OUT: ${{ runner.temp }}/signal.json
        run: |
          git config user.name "moat-monitor-bot"
          git config user.email "moat-monitor-bot@users.noreply.github.com"
          for n in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            rm -f "$SIGNAL_OUT"
            node scripts/refresh.mjs || { echo "refresh hiba"; sleep 20; continue; }
            node scripts/signals.mjs || echo "jelzés hiba"
            git add data adatok.md adatok.json adatok.csv llms.txt index.html
            git diff --cached --quiet && exit 0
            git commit -qm "Napi árfolyamfrissítés $(date -u +%F)"
            git push -q origin HEAD:main && exit 0
            echo "push ütközés, újra ($n)"; sleep $((n*5))
          done
          exit 1
      - name: Beragadt „Frissítés:” kérések lezárása (a frissítés lefutott)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null) | select(.title | test("^\\s*Frissítés\\s*:"; "i")) | .number' | while read -r n; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$n/comments" -f body="Frissítettem az árfolyamokat és a trendeket." >/dev/null || true
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$n" -f state=closed >/dev/null || true
          done
      - name: Jelzés trend- vagy ajánlásváltáskor (GitHub issue → e-mail értesítés)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNAL_OUT: ${{ runner.temp }}/signal.json
        run: |
          [ -f "$SIGNAL_OUT" ] || { echo "Nincs változás."; exit 0; }
          node -e 'const s=require(process.env.SIGNAL_OUT);require("fs").writeFileSync("t.txt",s.title);require("fs").writeFileSync("b.md",s.body)'
          gh label create jelzes --color FBCA04 --description "Trend- vagy ajánlásváltás" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh issue create -R "$GITHUB_REPOSITORY" --title "$(cat t.txt)" --body-file b.md --label jelzes
