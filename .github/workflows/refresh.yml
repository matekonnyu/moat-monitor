name: Napi árfolyamfrissítés

on:
  schedule:
    - cron: "40 5 * * *"   # 05:40 UTC = 07:40 (nyári idő) / 06:40 (téli idő) Budapesten
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/refresh.mjs
      - name: Commit
        run: |
          git config user.name "moat-monitor-bot"
          git config user.email "moat-monitor-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Napi árfolyamfrissítés $(date -u +%F)"
          git pull --rebase
          git push
