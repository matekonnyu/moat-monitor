name: Gombok (felvétel, elvetés, törlés, elemzési kérés)

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/issues.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "moat-monitor-bot"
          git config user.email "moat-monitor-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "$ISSUE_TITLE"
            node scripts/refresh.mjs || true
            git add data
            git diff --cached --quiet || git commit -m "Árfolyam az új céghez"
            git pull --rebase
            git push
          fi
